<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>seerr-hide-toggle harness</title>
<style>
  body { font-family: system-ui; margin: 0; background: #111827; color: #e5e7eb; min-height: 100vh; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 16px 24px; }
  .filterwrap { display: flex; align-items: center; }
  ul.cards-vertical { list-style: none; display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; padding: 24px; margin: 0; }
  ul.cards-vertical li { background: #1f2937; border-radius: 12px; height: 120px; position: relative; padding: 8px; font-size: 12px; }
  .minibadge { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="bar">
  <div class="filterwrap">
    <button style="display:inline-flex;align-items:center;gap:6px;background:rgba(31,41,55,.8);color:#e5e7eb;border:1px solid #4b5563;border-radius:8px;padding:8px 14px;">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><path d="M2 3a1 1 0 011-1h14a1 1 0 011 1v2.586a1 1 0 01-.293.707l-5.414 5.414V17a1 1 0 01-1.447.894l-2-1A1 1 0 018 16v-4.293L2.293 6.293A1 1 0 012 5.586V3z"/></svg>
      0 Active Filters
    </button>
  </div>
</div>

<ul class="cards-vertical">
  <li>Processing<span class="minibadge rounded-full" style="background:rgba(99,102,241,.85);border-radius:9999px;" ></span><script>document.currentScript.previousElementSibling.setAttribute('class','minibadge rounded-full shadow-md w-5 ring-1 p-0.5 bg-indigo-500/80 border-indigo-400 ring-indigo-400 text-indigo-100')</script></li>
  <li>Pending<span class="minibadge" style="background:rgba(234,179,8,.85);border-radius:9999px;"></span><script>document.currentScript.previousElementSibling.setAttribute('class','minibadge rounded-full shadow-md w-5 ring-1 p-0.5 bg-yellow-500/80 border-yellow-400 ring-yellow-400 text-yellow-100')</script></li>
  <li>Available<span class="minibadge" style="background:rgba(34,197,94,.85);border-radius:9999px;"></span><script>document.currentScript.previousElementSibling.setAttribute('class','minibadge rounded-full shadow-md w-5 ring-1 p-0.5 bg-green-500/80 border-green-400 ring-green-400 text-green-100')</script></li>
  <li>Blocklisted<span class="minibadge" style="background:rgba(239,68,68,.85);border-radius:9999px;"></span><script>document.currentScript.previousElementSibling.setAttribute('class','minibadge rounded-full shadow-md w-5 ring-1 p-0.5 bg-red-500/80 border-white ring-white text-white')</script></li>
  <li>Deleted<span class="minibadge" style="background:rgba(239,68,68,.85);border-radius:9999px;"></span><script>document.currentScript.previousElementSibling.setAttribute('class','minibadge rounded-full shadow-md w-5 ring-1 p-0.5 bg-red-500/80 border-red-400 ring-red-400 text-red-100')</script></li>
  <li>No badge</li>
</ul>

<script>
const gmStore = {};
window.GM_getValue = (k, d) => (k in gmStore ? gmStore[k] : d);
window.GM_setValue = (k, v) => { gmStore[k] = v; };
// GM_addValueChangeListener deliberately absent: exercises the guard.
</script>
<script src="../seerr-hide-toggle.user.js"></script>
</body>
</html>
